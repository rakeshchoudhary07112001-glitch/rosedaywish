<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
  <title>Rose Day for Akansha 🌹</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(#ff9a9e, #fad0c4);
      text-align: center;
      color: #fff;
      overflow: hidden;
    }

    h1 {
      margin-top: 40px;
      font-size: 32px;
    }

    .card {
      background: rgba(255,255,255,0.2);
      padding: 25px;
      border-radius: 20px;
      margin: 30px;
    }

    .photos {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    .photos img {
      width: 160px;
      border-radius: 15px;
      border: 2px solid white;
    }

    button {
      margin-top: 20px;
      padding: 12px 25px;
      border: none;
      border-radius: 25px;
      background: #ff4d6d;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      background: #ff1e4d;
    }
  </style>
</head>
<body>

  <h1>Happy Rose Day 🌹 Akansha</h1>

  <div class="card">
    <p>
      Just like a rose is special among flowers, <br>
      you are special among all people in my life. <br>
      This rose is not just a flower, it's my heart for you ❤️  
      <br><br>
      – Yours, Rakesh
    </p>

    <div class="photos">
      <img src="rose.jpeg" alt="Akansha Photo 1">
      <img src="1.jpg" alt="Akansha Photo 2">
    </div>

    <button onclick="alert('More surprises coming tomorrow 💖')">
      I Love You
    </button>
  </div>

</body>
</html>
